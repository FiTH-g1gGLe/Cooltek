<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cooltek – Heating Service Report</title>
<meta name="theme-color" content="#1b1f5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="pages">
  <!-- PAGE 1 -->
  <section class="page" id="page1">
    <header class="brand-head">
      <img src="logo.png" alt="Cooltek" class="logo">
      <div class="title"><span>Heating</span> Service Report</div>
      <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
    </header>

    <div class="details">
      <div class="col" id="details-left"></div>
      <div class="col" id="details-right"></div>
    </div>

    <div class="two-col">
      <div class="block">
        <h2>Outdoor unit detail</h2>
        <div id="outdoor"></div>
      </div>
      <div class="block">
        <h2>Indoor unit detail</h2>
        <div id="indoor"></div>
      </div>
    </div>
  </section>

  <!-- PAGE 2 -->
  <section class="page" id="page2">
    <div class="two-col top">
      <div>
        <div class="block">
          <h2>Electrical checks</h2>
          <div id="electrical"></div>
        </div>
        <div class="block">
          <h2>Unvented cylinder checks</h2>
          <div id="unvented"></div>
        </div>
      </div>
      <div>
        <div class="block">
          <h2>Heating system checks</h2>
          <div id="heating"></div>
        </div>
        <div class="block">
          <h2>Visit timings</h2>
          <div id="timings"></div>
        </div>
      </div>
    </div>

    <div class="two-col notes">
      <div class="note">
        <label for="f-workDone">Details of visit / work carried out</label>
        <textarea id="f-workDone" data-key="workDone" rows="5"></textarea>
        <div class="print-text" data-mirror="workDone"></div>
      </div>
      <div class="note">
        <label for="f-conclusion">Conclusion / recommendations</label>
        <textarea id="f-conclusion" data-key="conclusion" rows="5"></textarea>
        <div class="print-text" data-mirror="conclusion"></div>
      </div>
    </div>

    <div class="two-col sigs">
      <div class="sig">
        <div class="sig-head"><label>Engineer signature</label><button type="button" class="link no-print" data-clear-sig="sigEngineer">Clear</button></div>
        <canvas data-sig="sigEngineer"></canvas>
      </div>
      <div class="sig">
        <div class="sig-head"><label>Customer signature</label><button type="button" class="link no-print" data-clear-sig="sigCustomer">Clear</button></div>
        <canvas data-sig="sigCustomer"></canvas>
      </div>
    </div>

    <footer class="brand-foot">
      <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
      <img src="logo.png" alt="Cooltek" class="logo">
      <div class="contact" id="footContact"></div>
    </footer>
  </section>

  <!-- Photos (on screen only; the PDF gets its own photo pages) -->
  <section class="page photos-page no-print" id="photosEditor">
    <div class="block">
      <h2>Site visit images</h2>
      <p class="hint">Photos go on extra pages at the end of the PDF, 6 per page. Add a caption under each one if you like.</p>
      <div class="photo-grid" id="photoGrid"></div>
      <label class="add-photos">
        <input type="file" accept="image/*" multiple id="photoInput" hidden>
        <span>+ Add site photos</span>
      </label>
    </div>
  </section>
</div>

<nav class="toolbar no-print">
  <button type="button" class="btn" id="btnJobs">☰ Jobs</button>
  <button type="button" class="btn primary" id="btnPdf">Create PDF</button>
  <button type="button" class="btn" id="btnNewVisit" title="Start next visit for this site">Next visit</button>
  <span class="saved" id="savedNote"></span>
</nav>

<!-- Jobs panel -->
<div class="overlay no-print" id="jobsPanel" hidden>
  <div class="panel">
    <div class="panel-head">
      <h3>Jobs</h3>
      <button type="button" class="x" data-close aria-label="Close">×</button>
    </div>
    <input type="search" id="jobSearch" placeholder="Search customer, address, job ref, serial…" autocomplete="off">
    <button type="button" class="btn-blank" id="btnBlank">+ New blank report</button>
    <div class="job-list" id="jobList"></div>
  </div>
</div>

<!-- PDF ready sheet -->
<div class="overlay no-print" id="pdfSheet" hidden>
  <div class="panel small">
    <div class="panel-head">
      <h3>PDF ready</h3>
      <button type="button" class="x" data-close aria-label="Close">×</button>
    </div>
    <p class="pdf-name" id="pdfName"></p>
    <div class="sheet-actions">
      <button type="button" class="btn primary big" id="btnShare">Share / send</button>
      <button type="button" class="btn dark big" id="btnDownload">Download</button>
    </div>
  </div>
</div>

<div class="toast no-print" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
